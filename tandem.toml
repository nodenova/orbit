# Tandem, on this host: MacBook Pro M4 Max, 36 GB unified memory, ~488 GB free SSD.
#
# The docs derive every budget for 64 GB / 1 TB (HANDOFF sec 1, DEEPSEEK_V4 sec 5).
# This machine is 36 GB, so the numbers below are re-derived, not copied. The one
# structural consequence: tier 0 (24.7 GB on disk) and a streamed tier 1 (~12 GB
# resident) do not co-reside in 36 GB. Gate A and Gate B are each run standalone,
# which is what they measure anyway; a *serving* deployment on this host is rung 3.
# tandem.toml.example already predicted this case in the rung list.

backend = "mlx"

[server]
host = "127.0.0.1"
port = 8080

[tier0]
# 24.7 GB on disk, measured from the HF blob listing, not the card.
model = "mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit"
# The resolved snapshot, not the repo id. hash_artefact() takes a filesystem path
# and answers None for anything that is not one, so with only the repo id above the
# receipt reports no container hash at all - honest, and useless for attestation.
container_path = "/Users/vmehera/.cache/huggingface/hub/models--mlx-community--Qwen3.6-35B-A3B-OptiQ-4bit/snapshots/70a3aa32c7feef511182bf16aa332f37e8d82014"
adapter_dir = "adapters"
mtp = true
# Measured, replacing a comment that was wrong by ~50x in the cautious direction.
#
# The old note said 32k of KV "leaves nothing" on a 36 GB box. It costs 640 MiB.
# The real budget is Metal's `max_recommended_working_set_size` - 28.08 GiB, read
# from `mx.device_info()`, not 36 GB and not "36 minus an 8 GB macOS floor". Tier 0
# takes 23.0 GiB of it, leaving 5.08 GiB for KV and activations.
#
# This model's KV is small because most of its attention is linear: of 40 layers
# only 10 are full attention, at 2 KV heads x 256 head_dim, so 20 KiB/token. The
# other 30 carry a fixed ~30 MiB recurrent state that does not grow with context.
#   65536 tokens -> 1.25 GiB   131072 -> 2.50 GiB   262144 (native max) -> 5.00 GiB
#
# 64k is a 4x raise that is comfortably inside the measured headroom. The
# arithmetic supports 131072 as well, and the shipped `kv_config.json` would make
# even 262144 fit by quantising exactly those 10 layers - but neither has been
# checked against `mx.get_peak_memory()` on a loaded model, and the ceiling that
# actually binds here is prefill time, not KV memory: 131k tokens is ~136 s of
# wall clock at the measured 963 tok/s. Raise it against a peak-memory reading.
max_kv_tokens = 65536

[tier1]
# Rung 3, not rung 1, and that is a measurement rather than a preference.
#
# Streamed experts are arithmetically dead on this host. The model's own config
# gives 48 layers x 8 experts x 3.63 MB = 1.39 GB read per decoded token; this
# machine's SSD delivers 6.93 GB/s at 1 MB blocks and queue depth 24 (measured,
# page cache bypassed with F_NOCACHE). That is 4.2-5.0 tok/s. Gate B's floor is
# 200. The gap is 40x, and the largest lever - the expert cache - is worth ~2x.
# Three independent confirmations: the model card (~5 tok/s on an M3 Max 36 GB),
# ssd-moe/deepseek-v4-flash-mlx on a 48 GB Mac (4.5-5), and DEEPSEEK_V4 sec 5's own
# derivation (~3.5). A verifier that always returns a failed verdict is not a
# verifier, so rung 1 stays off here until the host has more memory, not more tuning.
#
# Rung 3 costs no memory at all: it is tier 0 with the adapter stripped. Its known
# weakness is that its verdicts are not independent - a verifier sharing the
# generator's weights shares its blind spots - and `Tier1Attestation.rung` records
# which rung served every verdict so a receipt never implies otherwise.
enabled = true
rung = "second_opinion"
# Unused while `rung = "second_opinion"`, which serves from tier 0's own weights.
# Kept because it is what Gate B would run against if this host ever gains the
# memory to make rung 1 worth measuring, and because a resolved snapshot is the
# thing that takes an hour to find again.
#
# Resolved snapshot, for the same reason tier 0 needs one: hash_artefact() answers
# None for anything that is not a filesystem path, and a Gate B number quoted with no
# container hash is not reproducible (sec 10.5).
container_path = "/Users/vmehera/.cache/huggingface/hub/models--mlx-community--Qwen3.5-122B-A10B-OptiQ-2bit/snapshots/1081c89e171447884d329abd7232566ebd38737c"
# The 122B, not the DeepSeek. Two reasons, both measured today rather than assumed:
# mlx-community/DeepSeek-V4-Flash-0731-OptiQ-2bit-mixed answers 401 (gated or absent)
# so it cannot be fetched at all, and at 92.5 GB it is budgeted for 64 GB. The 122B
# 2-bit is 46.9 GB on disk and mlx-optiq's own README documents it running on a
# 36 GB Mac at ~12 GB resident with experts streamed - this exact configuration.
model = "mlx-community/Qwen3.5-122B-A10B-OptiQ-2bit"
endpoint = "http://127.0.0.1:8081/v1"
stream_experts = true
# 12 GB, re-derived for 36 GB: ~8 OS + ~12 non-routed resident + ~4 activations
# leaves ~12. The 18 GB default is the 64 GB budget and does not fit here.
# Sweep 8/12/16 once Gate B has a number; do not tune it from this comment.
expert_cache_bytes = 12884901888
# 300 s, not the 180 s default. DEEPSEEK_V4 sec 4.3: at Gate B's 200 tok/s floor a
# 30k review costs ~150 s of prefill plus decode, and would degrade to a failed
# verdict on a gate that passed.
request_timeout_s = 300.0
reasoning_control = "auto"
swap_budget_s = 0.0
remote_transport = "tools/remote_tier1.py"
remote_api_key_env = "TANDEM_REMOTE_API_KEY"
remote_consent = ""

[router]
candidates = 3
candidate_temperature = 0.6
rerank_enabled = true
max_escalations_per_turn = 1
degrade_after_s = 45.0

[compaction]
enabled = true
strip_tool_schemas = true
keep_original = true
